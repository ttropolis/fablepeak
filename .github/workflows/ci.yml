name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # jsdom is the repo's only frontend devDependency (ADR 0003 decision 1);
      # the behavioural suite in test/behaviour/ needs it installed.
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: supabase db start
      - run: supabase db reset --local --no-seed
