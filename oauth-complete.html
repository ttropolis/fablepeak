<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FablePeak connection</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1c3d5a;
      color: #fff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    main { max-width: 440px; }
    #icon { font-size: 44px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #b6cddd; font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
    button {
      background: #22c1dc;
      border: 0;
      border-radius: 8px;
      color: #04303a;
      cursor: pointer;
      font-weight: 600;
      padding: 10px 18px;
    }
  </style>
</head>
<body>
  <main>
    <div id="icon" aria-hidden="true">⚠️</div>
    <h1 id="title">Connection failed</h1>
    <p id="message">Please close this window and try again.</p>
    <button type="button" id="close">Close</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const ok = params.get("ok") === "1";
    const title = params.get("title") || (ok ? "Connected" : "Connection failed");
    const message = params.get("message") ||
      (ok ? "Your account is connected. You can close this window." : "Please try again.");

    document.title = title;
    document.getElementById("icon").textContent = ok ? "✅" : "⚠️";
    document.getElementById("title").textContent = title;
    document.getElementById("message").textContent = message;
    document.getElementById("close").addEventListener("click", () => window.close());

    try {
      if (window.opener) {
        window.opener.postMessage({ source: "fablepeak-oauth", ok }, location.origin);
      }
    } catch (_) {}

    if (ok) setTimeout(() => window.close(), 1200);
  </script>
</body>
</html>
