<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3d5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metricoolito">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Metricoolito — Social Media Manager</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#182b3a; --muted:#6b7c8d;
    --brand:#1c3d5a; --accent:#22c1dc; --accent2:#7ee081; --danger:#e05a5a;
    --line:#e3e9ef; --chip-draft:#f0ad4e; --chip-sched:#22c1dc; --chip-pub:#5cb87a;
    --radius:12px; --shadow:0 1px 3px rgba(24,43,58,.08);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px}

  /* ---------- sidebar ---------- */
  aside{width:220px;background:var(--brand);color:#dfe9f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .logo{padding:18px 16px;font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .logo span{color:var(--accent)}
  .brandbox{margin:0 12px 14px;padding:10px;background:rgba(255,255,255,.08);border-radius:10px}
  .brandbox label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9db4c6}
  .brandbox select{width:100%;margin-top:6px;padding:7px 8px;border-radius:8px;border:none;background:#fff;color:var(--ink);font-size:13px}
  nav{flex:1;overflow-y:auto}
  nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 18px;background:none;border:none;color:#c4d4e2;font-size:14px;cursor:pointer;text-align:left;border-left:3px solid transparent}
  nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  nav button.active{background:rgba(34,193,220,.15);color:#fff;border-left-color:var(--accent)}
  nav .ic{width:20px;text-align:center}
  .sidefoot{padding:12px 16px;font-size:11px;color:#7f95a8;border-top:1px solid rgba(255,255,255,.1)}

  /* ---------- main ---------- */
  main{flex:1;padding:22px 26px;max-width:1200px}
  h1{font-size:21px;margin-bottom:2px}
  .sub{color:var(--muted);margin-bottom:18px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .kpi .n{font-size:24px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .kpi .d{font-size:12px;margin-top:4px}
  .up{color:#3d9b63}.down{color:var(--danger)}
  button.btn{background:var(--accent);border:none;color:#04303a;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  button.btn:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  button.mini{padding:4px 9px;font-size:12px;border-radius:6px}
  button.dangerb{background:var(--danger);color:#fff}
  input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],textarea,select.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:70px}
  label.f{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 4px}

  /* ---------- calendar ---------- */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .calhead h2{font-size:17px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:96px;min-width:0;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
  .day:hover{border-color:var(--accent)}
  .day.other{opacity:.42}
  .day.today{border:2px solid var(--accent)}
  .day.dragover{background:#e7f8fb;border-color:var(--accent)}
  .dnum{font-size:12px;font-weight:600;color:var(--muted)}
  .post{font-size:11px;padding:3px 6px;border-radius:6px;color:#fff;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:4px;align-items:center}
  .post .nets{font-size:9px;opacity:.9}
  .post.draft{background:var(--chip-draft)}
  .post.scheduled{background:var(--chip-sched)}
  .post.published{background:var(--chip-pub)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,30,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:520px;max-width:100%;max-height:92vh;overflow-y:auto;padding:22px}
  .modal h3{margin-bottom:4px}
  .netpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .netpick label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .netpick label.on{background:#e7f8fb;border-color:var(--accent)}
  .modalfoot{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
  .modalfoot .right{display:flex;gap:8px}

  /* ---------- charts ---------- */
  .chartbox{flex:1;min-width:300px}
  .chartbox h4{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  svg text{font-family:inherit}
  .heat{display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;font-size:9px}
  .heat .hl{color:var(--muted);display:flex;align-items:center}
  .heat .hc{aspect-ratio:1;border-radius:2px;min-width:8px}
  .heat .hh{color:var(--muted);text-align:center}

  /* ---------- inbox ---------- */
  .inboxwrap{display:flex;gap:14px;min-height:440px}
  .msglist{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
  .msg{padding:10px 12px;cursor:pointer}
  .msg.sel{border-color:var(--accent);background:#f2fbfd}
  .msg .from{font-weight:600;display:flex;justify-content:space-between;font-size:13px}
  .msg .prev{color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg.unread .from::before{content:"●";color:var(--accent);margin-right:6px}
  .thread{flex:1;display:flex;flex-direction:column}
  .bubbles{flex:1;display:flex;flex-direction:column;gap:8px;padding:6px 2px;overflow-y:auto}
  .bub{max-width:75%;padding:9px 12px;border-radius:12px;font-size:13px}
  .bub.them{background:#eef2f6;align-self:flex-start}
  .bub.me{background:var(--accent);color:#04303a;align-self:flex-end}
  .replyrow{display:flex;gap:8px;margin-top:10px}
  .tabbar{display:flex;gap:6px;margin-bottom:12px}
  .tabbar button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;color:var(--ink)}
  .tabbar button.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* ---------- smartlinks ---------- */
  .slwrap{display:flex;gap:22px;flex-wrap:wrap}
  .sledit{flex:1;min-width:300px}
  .phone{width:290px;border:10px solid #182b3a;border-radius:34px;background:#fff;padding:24px 16px;height:560px;overflow-y:auto;flex-shrink:0}
  .phone .av{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 10px;background:#eef2f6}
  .phone h5{text-align:center;font-size:16px}
  .phone .bio{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 16px}
  .slink{display:block;text-align:center;padding:11px;border-radius:10px;color:#fff;font-weight:600;font-size:13px;margin-bottom:10px;text-decoration:none;cursor:pointer}
  .slrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .slrow input{flex:1}
  .clicks{font-size:11px;color:var(--muted);white-space:nowrap}

  /* ---------- connections ---------- */
  .conngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .conn{display:flex;flex-direction:column;gap:8px}
  .conn .top{display:flex;align-items:center;gap:10px}
  .nico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
  .conn .st{font-size:12px;color:var(--muted)}
  .conn .st.on{color:#3d9b63;font-weight:600}

  /* ---------- report ---------- */
  table.rep{width:100%;border-collapse:collapse;margin-top:10px}
  table.rep th,table.rep td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
  table.rep th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}

  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--brand);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}
  @media print{
    aside,.noprint,.toast{display:none!important}
    main{padding:0;max-width:none}
    body{background:#fff}
  }
  @media (max-width:820px){
    body{flex-direction:column;font-size:15px}
    aside{width:100%;height:auto;position:sticky;top:0;z-index:40;padding-bottom:6px}
    .logo{padding:12px 14px 8px;font-size:16px}
    .brandbox{margin:0 10px 8px;padding:8px}
    nav{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:2px;padding:0 8px}
    nav button{width:auto;flex:0 0 auto;padding:9px 12px;border-left:none;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
    nav button.active{border-left:none;border-bottom-color:var(--accent)}
    .sidefoot{display:none}
    main{padding:14px 12px}
    .day{min-height:64px;padding:4px}
    .post .nets{display:none}
    .inboxwrap{flex-direction:column}
    .msglist{width:100%}
    .thread{min-height:320px}
    .phone{width:100%;max-width:320px;margin:0 auto}
    .slrow{flex-wrap:wrap}
    button.btn,nav button,.tabbar button{min-height:38px}
  }
</style>

<aside>
  <div class="logo">📊 Metricool<span>ito</span></div>
  <div class="brandbox">
    <label>Brand</label>
    <select id="brandSel" onchange="switchBrand(this.value)"></select>
  </div>
  <nav id="nav"></nav>
  <div class="sidefoot">Local prototype · data lives in your browser</div>
</aside>

<main id="main"></main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =============== constants =============== */
const NETWORKS = [
  {id:"instagram", name:"Instagram", short:"IG", color:"#d6437f"},
  {id:"x",         name:"X / Twitter", short:"X",  color:"#111111"},
  {id:"facebook",  name:"Facebook",  short:"FB", color:"#1877f2"},
  {id:"linkedin",  name:"LinkedIn",  short:"LI", color:"#0a66c2"},
  {id:"tiktok",    name:"TikTok",    short:"TT", color:"#00b7b0"},
  {id:"youtube",   name:"YouTube",   short:"YT", color:"#e04040"},
  {id:"pinterest", name:"Pinterest", short:"PN", color:"#bd2126"},
  {id:"gbp",       name:"Google Business", short:"GB", color:"#34a853"},
];
const VIEWS = [
  {id:"planner",    ic:"🗓",  name:"Planner"},
  {id:"analytics",  ic:"📈", name:"Analytics"},
  {id:"inbox",      ic:"💬", name:"Inbox"},
  {id:"smartlinks", ic:"🔗", name:"SmartLinks"},
  {id:"reports",    ic:"📄", name:"Reports"},
  {id:"connections",ic:"🔌", name:"Connections"},
  {id:"settings",   ic:"⚙️", name:"Settings"},
];
const LS_KEY = "metricoolito_v1";
const uid = () => Math.random().toString(36).slice(2,10);
const fmtDate = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr = () => fmtDate(new Date());

/* =============== state =============== */
let db = null;
let view = "planner";
let calCursor = new Date();      // month shown in planner
let selectedMsg = null;
let inboxFilter = "all";
let analyticsNet = "all";

function defaultBrand(name){
  const b = {
    id: uid(), name,
    seed: Math.floor(Math.random()*10000),
    connections: {}, posts: [], inbox: [],
    smartlink: { title:name, bio:"Welcome! All my links in one place.", avatar:"🚀", color:"#22c1dc",
      links:[{id:uid(),title:"Our website",url:"https://example.com",clicks:132},
             {id:uid(),title:"Latest video",url:"https://example.com/video",clicks:87},
             {id:uid(),title:"Newsletter",url:"https://example.com/news",clicks:45}] }
  };
  return b;
}
function seedDemo(){
  const b = defaultBrand("My Brand");
  b.connections = {instagram:"@mybrand", x:"@mybrand", linkedin:"my-brand", tiktok:"@mybrand"};
  const base = new Date();
  const mk = (dayOff,hour,text,nets,status)=>{
    const d = new Date(base); d.setDate(d.getDate()+dayOff);
    return {id:uid(), date:fmtDate(d), time:String(hour).padStart(2,"0")+":00",
            text, networks:nets, status};
  };
  b.posts = [
    mk(-6,10,"Behind the scenes: how we build our product 🛠",["instagram","tiktok"],"published"),
    mk(-4,15,"5 lessons we learned this quarter — a thread 🧵",["x","linkedin"],"published"),
    mk(-2,9,"Customer story: +40% growth in 3 months 🚀",["linkedin"],"published"),
    mk(0,18,"New feature drop! Check the link in bio ✨",["instagram","x","facebook"],"scheduled"),
    mk(1,11,"Weekly tips: batch your content on Mondays",["instagram"],"scheduled"),
    mk(3,17,"Live Q&A this Friday — drop your questions 👇",["instagram","tiktok"],"scheduled"),
    mk(5,12,"Draft: monthly recap carousel",["instagram","linkedin"],"draft"),
  ];
  b.inbox = [
    {id:uid(), net:"instagram", from:"@sofia.designs", resolved:false, unread:true,
     msgs:[{who:"them",text:"Hi! Do you ship internationally?"}]},
    {id:uid(), net:"x", from:"@devmarcus", resolved:false, unread:true,
     msgs:[{who:"them",text:"Loved the thread on quarterly lessons. Any chance of a blog version?"}]},
    {id:uid(), net:"facebook", from:"Laura P.", resolved:false, unread:false,
     msgs:[{who:"them",text:"What are your support hours?"},{who:"me",text:"Hi Laura! Mon–Fri, 9–18h CET 😊"},{who:"them",text:"Perfect, thanks!"}]},
    {id:uid(), net:"linkedin", from:"Carlos M. (Acme Corp)", resolved:true, unread:false,
     msgs:[{who:"them",text:"Interested in a partnership. Who should I talk to?"},{who:"me",text:"Hi Carlos, just sent you our partnerships deck!"}]},
  ];
  return {brands:[b], activeBrand:b.id};
}
function load(){
  try{ db = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ db=null; }
  if(!db || !db.brands || !db.brands.length){ db = seedDemo(); save(); }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
function brand(){ return db.brands.find(b=>b.id===db.activeBrand) || db.brands[0]; }
function netOf(id){ return NETWORKS.find(n=>n.id===id); }
function connectedNets(){ return NETWORKS.filter(n=>brand().connections[n.id]); }

/* auto-publish posts whose scheduled datetime passed */
function tickPublish(){
  const now = new Date();
  let changed = false;
  db.brands.forEach(b=>b.posts.forEach(p=>{
    if(p.status==="scheduled" && new Date(p.date+"T"+(p.time||"09:00")) <= now){
      p.status="published"; changed=true;
    }
  }));
  if(changed) save();
}

/* =============== deterministic demo metrics =============== */
function rng(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646;
  return ()=> (s = s*16807 % 2147483647) / 2147483647; }
function metricSeries(days, netId){
  // followers + daily engagement for last `days` days, deterministic per brand+network
  const b = brand();
  const seedN = b.seed + (netId==="all"?0:NETWORKS.findIndex(n=>n.id===netId)*97);
  const r = rng(seedN+1);
  const baseF = 800 + Math.floor(r()*9000);
  const out=[];
  let f = baseF;
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = fmtDate(d);
    f += Math.floor(r()*40 - 8);
    const posted = b.posts.filter(p=>p.date===ds && p.status==="published" &&
      (netId==="all" || p.networks.includes(netId))).length;
    const eng = Math.floor(r()*120 + posted*260);
    const imp = Math.floor(eng * (14 + r()*10));
    out.push({date:ds, followers:f, engagement:eng, impressions:imp});
  }
  return out;
}

/* =============== ui plumbing =============== */
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function openModal(html){ document.getElementById("modalBody").innerHTML=html;
  document.getElementById("overlay").classList.add("open"); }
function closeModal(){ document.getElementById("overlay").classList.remove("open"); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderNav(){
  document.getElementById("nav").innerHTML = VIEWS.map(v=>
    `<button class="${v.id===view?'active':''}" onclick="go('${v.id}')">
       <span class="ic">${v.ic}</span>${v.name}</button>`).join("");
  const sel=document.getElementById("brandSel");
  sel.innerHTML = db.brands.map(b=>`<option value="${b.id}" ${b.id===db.activeBrand?'selected':''}>${esc(b.name)}</option>`).join("");
}
function go(v){ view=v; selectedMsg=null; render(); }
function switchBrand(id){ db.activeBrand=id; save(); render(); }
function render(){
  tickPublish(); renderNav();
  const m=document.getElementById("main");
  ({planner:renderPlanner, analytics:renderAnalytics, inbox:renderInbox,
    smartlinks:renderSmartlinks, reports:renderReports,
    connections:renderConnections, settings:renderSettings}[view])(m);
}

/* =============== PLANNER =============== */
function renderPlanner(m){
  const y=calCursor.getFullYear(), mo=calCursor.getMonth();
  const monthName = calCursor.toLocaleString("en",{month:"long",year:"numeric"});
  const first = new Date(y,mo,1);
  let start = new Date(first); start.setDate(1-((first.getDay()+6)%7)); // Monday start
  const cells=[];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  const b=brand();
  const postsBy={}; b.posts.forEach(p=>{ (postsBy[p.date]=postsBy[p.date]||[]).push(p); });

  m.innerHTML = `
  <h1>Content Planner</h1>
  <div class="sub">Click a day to schedule. Drag posts between days. ${connectedNets().length? "" : "⚠️ No profiles connected yet — go to Connections."}</div>
  <div class="card">
    <div class="calhead">
      <h2>${monthName}</h2>
      <div style="display:flex;gap:8px">
        <button class="btn ghost mini" onclick="calMove(-1)">← Prev</button>
        <button class="btn ghost mini" onclick="calCursor=new Date();render()">Today</button>
        <button class="btn ghost mini" onclick="calMove(1)">Next →</button>
        <button class="btn mini" onclick="openPostModal(null,'${todayStr()}')">+ New post</button>
      </div>
    </div>
    <div class="calgrid">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")}
      ${cells.map(d=>{
        const ds=fmtDate(d);
        const cls=["day", d.getMonth()!==mo?"other":"", ds===todayStr()?"today":""].join(" ");
        const chips=(postsBy[ds]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||"")).map(p=>
          `<div class="post ${p.status}" draggable="true" title="${esc(p.text)}"
                ondragstart="dragPost(event,'${p.id}')"
                onclick="event.stopPropagation();openPostModal('${p.id}')">
             <span class="nets">${p.networks.map(n=>netOf(n)?.short||n).join("·")}</span>${esc(p.text)}</div>`).join("");
        return `<div class="${cls}" onclick="openPostModal(null,'${ds}')"
                  ondragover="event.preventDefault();this.classList.add('dragover')"
                  ondragleave="this.classList.remove('dragover')"
                  ondrop="dropPost(event,'${ds}')">
                  <div class="dnum">${d.getDate()}</div>${chips}</div>`;
      }).join("")}
    </div>
    <div class="legend">
      <span><i style="background:var(--chip-draft)"></i>Draft</span>
      <span><i style="background:var(--chip-sched)"></i>Scheduled</span>
      <span><i style="background:var(--chip-pub)"></i>Published</span>
    </div>
  </div>`;
}
function calMove(n){ calCursor.setMonth(calCursor.getMonth()+n); render(); }
function dragPost(ev,id){ ev.dataTransfer.setData("text/plain",id); }
function dropPost(ev,ds){
  ev.preventDefault(); ev.currentTarget.classList.remove("dragover");
  const id=ev.dataTransfer.getData("text/plain");

function savePost(id){
  const text=document.getElementById("pm_text").value.trim();

  if(!text) return toast("Write some content first");
  if(!nets.length) return toast("Pick at least one network");
  const b=brand();
  if(id){ const p=b.posts.find(x=>x.id===id); Object.assign(p,{text,networks:nets,date,time,status}); }
  else b.posts.push({id:uid(),text,networks:nets,date,time,status});
  save(); closeModal(); render(); toast(id?"Post updated":"Post scheduled ✔");
}

function dupPost(id){ const b=brand(); const p=b.posts.find(x=>x.id===id);

/* =============== ANALYTICS =============== */
function lineChart(series, key, color){
  const W=560,H=170,P=28;
  const vals=series.map(s=>s[key]);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts=series.map((s,i)=>{
    const x=P+i*(W-2*P)/(series.length-1);
    const y=H-P-(s[key]-min)/span*(H-2*P);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=path+` L${pts[pts.length-1][0]},${H-P} L${pts[0][0]},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    <path d="${area}" fill="${color}22"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    <text x="${P}" y="14" font-size="11" fill="#6b7c8d">${max.toLocaleString()}</text>
    <text x="${P}" y="${H-8}" font-size="11" fill="#6b7c8d">${min.toLocaleString()}</text>
    <text x="${W-P}" y="${H-8}" font-size="11" text-anchor="end" fill="#6b7c8d">${series[series.length-1].date.slice(5)}</text>
  </svg>`;
}
function barChart(series, key, color){
  const W=560,H=170,P=26;
  const vals=series.map(s=>s[key]); const max=Math.max(...vals)||1;
  const bw=(W-2*P)/series.length;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    ${series.map((s,i)=>{
      const h=(s[key]/max)*(H-2*P);
      return `<rect x="${(P+i*bw+1).toFixed(1)}" y="${(H-P-h).toFixed(1)}" width="${Math.max(bw-2,1).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}"/>`;
    }).join("")}
    <text x="${P}" y="14" font-size="11" fill="#6b7c8d">max ${max.toLocaleString()}</text>
  </svg>`;
}
function bestTimesHeat(){
  const b=brand(); const r=rng(b.seed+42);
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let cells=`<div></div>${Array.from({length:24},(_,h)=>`<div class="hh">${h%3===0?h:""}</div>`).join("")}`;
  for(const d of days){
    cells+=`<div class="hl">${d}</div>`;
    for(let h=0;h<24;h++){
      let v=r();
      if(h>=8&&h<=11)v=Math.min(1,v+.35); if(h>=17&&h<=20)v=Math.min(1,v+.45); if(h<6)v*=.2;
      cells+=`<div class="hc" title="${d} ${h}:00 — activity ${(v*100)|0}%" style="background:rgba(34,193,220,${(v*.9+.05).toFixed(2)})"></div>`;
    }
  }
  return `<div class="heat">${cells}</div>`;
}

function openMsg(id){ selectedMsg=id; const c=brand().inbox.find(x=>x.id===id); if(c){c.unread=false; save();} render(); }
function sendReply(id){
  const inp=document.getElementById("replyInp"); const t=inp.value.trim(); if(!t)return;
  brand().inbox.find(c=>c.id===id).msgs.push({who:"me",text:t}); save(); render(); toast("Reply sent");
}
function toggleResolved(id){ const c=brand().inbox.find(x=>x.id===id); c.resolved=!c.resolved;
  save(); selectedMsg=null; render(); }
function fakeIncoming(){
  const samples=[["instagram","@new.follower","Love your content! How can I work with you?"],
    ["x","@curious_dev","Is there an API for this?"],
    ["tiktok","@trendwatcher","That last video was 🔥🔥"],
    ["facebook","Miguel R.","Do you have any discounts this month?"]];
  const [net,from,text]=samples[Math.floor(Math.random()*samples.length)];
  brand().inbox.unshift({id:uid(),net,from,resolved:false,unread:true,msgs:[{who:"them",text}]});
  save(); render(); toast("New message received");
}

  if(db.activeBrand===id)db.activeBrand=db.brands[0].id;

function exportData(){
  const a=document.createElement("a");
  a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(db,null,2));
  a.download="metricoolito-backup-"+todayStr()+".json"; a.click(); toast("Backup downloaded");
}
function importData(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.brands||!Array.isArray(d.brands))throw 0;
      db=d; db.activeBrand=db.brands[0].id; save(); render(); toast("Backup restored ✔");
    }catch(e){ toast("Invalid backup file"); } };
  r.readAsText(f); inp.value="";
}
function resetData(){
  if(!confirm("Replace ALL current data with fresh demo data?"))return;
  db=seedDemo(); save(); render(); toast("Demo data restored");
}
