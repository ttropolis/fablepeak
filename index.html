<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3d5a">
<meta name="description" content="FablePeak — plan, publish, analyze and manage your social media from one secure workspace, with an optional local demo mode.">
<meta name="google-site-verification" content="OtD4ijHyMlSLwRjodvTq1ew9Z1ms9oAFa6HxVnWbM94">
<meta name="facebook-domain-verification" content="3h9h4g4enlb09n1uaukmftczn5aoih">
<meta property="og:title" content="FablePeak — Social Media Manager">
<meta property="og:description" content="Plan, publish, analyze and manage your social media from one dashboard.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fablepeak.com/">
<meta property="og:image" content="https://fablepeak.com/icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FablePeak">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>FablePeak — Social Media Manager</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#182b3a; --muted:#6b7c8d;
    --brand:#1c3d5a; --accent:#22c1dc; --accent2:#7ee081; --danger:#e05a5a;
    --line:#e3e9ef; --chip-draft:#f0ad4e; --chip-sched:#22c1dc; --chip-pub:#5cb87a; --chip-fail:#d95c5c;
    /* ADR 0006 decision 13: awaiting approval is amber like a draft, because it
       is still unpublished — but a deeper, browner amber, so a calendar of
       drafts and pending posts is readable at chip size without relying on the
       label a 11px chip may well have ellipsised away. */
    --chip-pending:#b06f10;
    --radius:12px; --shadow:0 1px 3px rgba(24,43,58,.08);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  :focus-visible{outline:3px solid #0b7890;outline-offset:2px}
  body{background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px}

  /* ---------- sidebar ---------- */
  aside{width:220px;background:var(--brand);color:#dfe9f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .logo{padding:18px 16px;font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .logo span{color:var(--accent)}
  .brandbox{margin:0 12px 14px;padding:10px;background:rgba(255,255,255,.08);border-radius:10px}
  .brandbox label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9db4c6}
  .brandbox select{width:100%;margin-top:6px;padding:7px 8px;border-radius:8px;border:none;background:#fff;color:var(--ink);font-size:13px}
  nav{flex:1;overflow-y:auto}
  nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 18px;background:none;border:none;color:#c4d4e2;font-size:14px;cursor:pointer;text-align:left;border-left:3px solid transparent}
  nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  nav button.active{background:rgba(34,193,220,.15);color:#fff;border-left-color:var(--accent)}
  nav .ic{width:20px;text-align:center}
  /* ADR 0006 decision 13: how many posts are waiting on this owner, on the nav
     entry that leads to them. Never a control — the button around it is. */
  .navbadge{margin-left:auto;background:var(--chip-pending);color:#fff;font-size:11px;font-weight:700;line-height:1;padding:3px 7px;border-radius:9px}
  .sidefoot{padding:12px 16px;font-size:11px;color:#7f95a8;border-top:1px solid rgba(255,255,255,.1)}

  /* ---------- main ---------- */
  main{flex:1;padding:22px 26px;max-width:1200px}
  h1{font-size:21px;margin-bottom:2px}
  .sub{color:var(--muted);margin-bottom:18px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .kpi .n{font-size:24px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .kpi .d{font-size:12px;margin-top:4px}
  .up{color:#3d9b63}.down{color:var(--danger)}
  button.btn{background:var(--accent);border:none;color:#04303a;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  button.btn:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  button.mini{padding:4px 9px;font-size:12px;border-radius:6px}
  button.dangerb{background:var(--danger);color:#fff}
  input[type=text],input[type=url],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],textarea,select.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:70px}
  label.f{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 4px}

  /* ---------- calendar ---------- */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .calhead h2{font-size:17px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:96px;min-width:0;padding:6px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
  .day:hover{border-color:var(--accent)}
  .day.other{opacity:.42}
  .day.today{border:2px solid var(--accent)}
  .day.dragover{background:#e7f8fb;border-color:var(--accent)}
  .dnum{font-size:12px;font-weight:600;color:var(--muted);border:0;background:transparent;text-align:left;cursor:pointer}
  .post{font-size:11px;padding:3px 6px;border:0;border-radius:6px;color:#fff;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:4px;align-items:center;width:100%;text-align:left}
  .post .nets{font-size:9px;opacity:.9}
  .post.draft{background:var(--chip-draft)}
  .post.pending_approval{background:var(--chip-pending)}
  .post.scheduled{background:var(--chip-sched)}
  .post.publishing{background:#2f91b5}
  .post.published{background:var(--chip-pub)}
  .post.failed{background:var(--chip-fail)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,30,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:520px;max-width:100%;max-height:92vh;overflow-y:auto;padding:22px}
  .modal h3{margin-bottom:4px}
  .delivery-panel{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#f8fafc}
  .delivery-panel h4{font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .delivery-row{display:grid;grid-template-columns:120px 1fr;gap:4px 8px;padding:7px 0;border-top:1px solid var(--line);font-size:12px}
  .delivery-row:first-of-type{border-top:0}.delivery-row small{grid-column:2;color:var(--danger)}
  .delivery-panel button{margin-top:8px}
  /* approval (ADR 0006 decision 13). Same shape as the delivery panel: a bounded
     block at the top of the composer that says what state this post is in. */
  .approval-panel{border:1px solid var(--line);border-left:4px solid var(--chip-pending);border-radius:10px;padding:12px;margin:10px 0;background:#fdf8f1}
  .approval-panel h4{font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .approval-note{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:8px}
  .approval-panel .approval-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .netpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .netpick label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .netpick label.on{background:#e7f8fb;border-color:var(--accent)}
  .netreason{display:block;color:#8b3f3f;font-size:10px;margin-left:3px}
  .ai-assist{display:block;margin-top:10px}
  .ai-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ai-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .ai-assist button[disabled]{opacity:.5;cursor:not-allowed}
  .ai-out{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}
  .ai-outhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .ai-sugg{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;text-align:left;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
  .ai-sugg:hover{border-color:var(--accent);background:#f2fbfd}
  .ai-note{font-size:11px;color:var(--muted)}
  /* per-network copy (ADR 0005 decisions 11-12) */
  .charcount{font-size:11px;color:var(--muted);margin-top:4px;text-align:right;min-height:14px}
  .charcount.near{color:#8a6100}
  .charcount.over{color:var(--danger);font-weight:600}
  .percheck{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;cursor:pointer}
  .variants details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#f8fafc}
  /* a flex <summary> loses its native marker in Chromium, and the row has to
     keep saying "this opens" — so the caret is drawn back in */
  .variants summary{cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;list-style:none}
  .variants summary::-webkit-details-marker{display:none}
  .variants summary::before{content:"▸";color:var(--muted);font-size:10px;width:9px}
  .variants details[open] summary::before{content:"▾"}
  .variant-state{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .variants textarea{margin-top:8px;min-height:60px}
  .variant-empty{font-size:12px;color:var(--muted);margin-top:8px}
  .threadnote:empty{display:none}
  .threadnote{margin-top:8px;font-size:12px}
  .threadnote-head{margin:0;font-weight:600;color:var(--muted)}
  .threadnote-over{margin:0;color:var(--danger);font-weight:600}
  .threadnote-list{margin:6px 0 0;padding-left:20px;color:var(--muted);line-height:1.5}
  .threadnote-list li{overflow-wrap:anywhere}
  /* Hashtag groups — the saved-set affordance beside the AI assist row in the
     composer, and the list + editor in Settings (ADR 0005 publishing depth). */
  .hgroups{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px;background:#f8fafc}
  .hgroups summary{cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;list-style:none}
  .hgroups summary::-webkit-details-marker{display:none}
  .hgroups summary::before{content:"▸";color:var(--muted);font-size:10px;width:9px}
  .hgroups[open] summary::before{content:"▾"}
  .hgroup-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .hgroup-pick{text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .hgroup-pick:hover{border-color:var(--accent);background:#f2fbfd}
  .hgroup-name{font-size:13px;font-weight:600}
  .hgroup-preview{font-size:12px;color:var(--muted);word-break:break-word}
  .hgroup-note{font-size:11px;color:var(--muted);margin-top:8px}
  .hgroup{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .hgroup-head{display:flex;align-items:center;gap:8px;font-size:13px}
  .hgroup-count{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .hgroup-tags{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}
  .hgroup-acts{display:flex;gap:6px;margin-top:8px}
  /* Instagram carousel — the extra media items, shown only while Instagram is
     a selected network (ADR 0005 publishing depth). */
  .carousel-panel{border:1px solid var(--line);border-left:4px solid #d6437f;border-radius:10px;padding:12px;margin:10px 0;background:#fdf7fa}
  .carousel-panel h4{font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .carousel-note{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0}
  .carousel-list{list-style:none;margin:8px 0;display:flex;flex-direction:column;gap:8px}
  .carousel-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .carousel-item input{flex:1;min-width:160px}
  .carousel-index{width:20px;height:20px;border-radius:50%;background:#d6437f;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .carousel-cover-note{font-size:12px;color:var(--muted)}
  .media-preview.carousel-thumb{margin:0;max-height:48px;flex:none}
  .carousel-thumb.on img,.carousel-thumb.on video{max-height:48px;border-radius:6px}
  .carousel-count{font-size:11px;color:var(--muted);margin-top:6px}
  /* Per-post Instagram options — the Reel's placement and an image's alt text,
     shown only while Instagram is a selected network and only for the media the
     choice applies to (ADR 0005 publishing depth). */
  .instagram-panel{border:1px solid var(--line);border-left:4px solid #c13584;border-radius:10px;padding:12px;margin:10px 0;background:#fdf7fb}
  .instagram-panel h4{font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .instagram-note{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0}
  .instagram-where{border:0;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:6px}
  .instagram-where legend{padding:0;margin-bottom:4px}
  .instagram-choice{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap;cursor:pointer}
  /* TikTok Direct Post options — the account-driven form the Content Posting
     API guidelines require, and the consent line that sits beside Save. */
  .tiktok-panel{border:1px solid var(--line);border-left:4px solid #00b7b0;border-radius:10px;padding:12px;margin:12px 0;background:#f6fbfb}
  .tiktok-panel h4{font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .tiktok-creator{font-size:13px;margin-bottom:8px}
  .tiktok-note{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0}
  .tiktok-note.over{color:var(--danger);font-weight:600}
  .tiktok-toggles{display:flex;flex-direction:column;gap:4px;margin-top:10px}
  .tiktok-toggle{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap;cursor:pointer}
  .tiktok-toggle.off{opacity:.5;cursor:not-allowed}
  .tiktok-brands{margin-top:8px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
  .tiktok-consent{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
  .fieldrow{display:flex;gap:10px;flex-wrap:wrap}
  .modalfoot{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
  .modalfoot .right{display:flex;gap:8px}
  .upload-actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .filebtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);border:1px solid transparent;color:#04303a;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;min-height:38px}
  .filebtn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .filebtn input{display:none}
  .mobile-only{display:none}
  .media-preview{display:none;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eef2f6;max-height:240px}
  .media-preview.on{display:flex;align-items:center;justify-content:center}
  .media-preview img,.media-preview video{display:block;max-width:100%;max-height:240px;object-fit:contain}
  .upload-status{font-size:12px;color:var(--muted);line-height:1.4;flex:1;min-width:180px}
  .mobile-agenda{display:none}

  /* ---------- charts ---------- */
  .chartbox{flex:1;min-width:300px}
  .chartbox h4{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  svg text{font-family:inherit}
  .heat{display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;font-size:9px}
  .heat .hl{color:var(--muted);display:flex;align-items:center}
  .heat .hc{aspect-ratio:1;border-radius:2px;min-width:8px}
  .heat .hh{color:var(--muted);text-align:center}

  /* ---------- inbox ---------- */
  .inboxwrap{display:flex;gap:14px;min-height:440px}
  .msglist{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
  .msg{padding:10px 12px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit}
  .msg.sel{border-color:var(--accent);background:#f2fbfd}
  .msg .from{font-weight:600;display:flex;justify-content:space-between;font-size:13px}
  .msg .prev{color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg.unread .from::before{content:"●";color:var(--accent);margin-right:6px}
  .thread{flex:1;display:flex;flex-direction:column}
  .bubbles{flex:1;display:flex;flex-direction:column;gap:8px;padding:6px 2px;overflow-y:auto}
  .bub{max-width:75%;padding:9px 12px;border-radius:12px;font-size:13px}
  .bub.them{background:#eef2f6;align-self:flex-start}
  .bub.me{background:var(--accent);color:#04303a;align-self:flex-end}
  .replyrow{display:flex;gap:8px;margin-top:10px}
  .tabbar{display:flex;gap:6px;margin-bottom:12px}
  .tabbar button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;color:var(--ink)}
  .tabbar button.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* ---------- smartlinks ---------- */
  .slwrap{display:flex;gap:22px;flex-wrap:wrap}
  .sledit{flex:1;min-width:300px}
  .phone{width:290px;border:10px solid #182b3a;border-radius:34px;background:#fff;padding:24px 16px;height:560px;overflow-y:auto;flex-shrink:0}
  .phone .av{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 10px;background:#eef2f6}
  .phone h5{text-align:center;font-size:16px}
  .phone .bio{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 16px}
  .slink{display:block;text-align:center;padding:11px;border-radius:10px;color:#fff;font-weight:600;font-size:13px;margin-bottom:10px;text-decoration:none;cursor:pointer}
  .slrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .slrow input{flex:1}
  .clicks{font-size:11px;color:var(--muted);white-space:nowrap}

  /* ---------- connections ---------- */
  .conngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .conn{display:flex;flex-direction:column;gap:8px}
  .conn .top{display:flex;align-items:center;gap:10px}
  .nico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
  .conn .st{font-size:12px;color:var(--muted)}
  .conn .st.on{color:#3d9b63;font-weight:600}

  /* ---------- report ---------- */
  table.rep{width:100%;border-collapse:collapse;margin-top:10px}
  table.rep th,table.rep td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
  table.rep th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}

  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--brand);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;z-index:120;pointer-events:none}
  .toast.show{opacity:1}

  /* ---------- welcome / auth gate ---------- */
  #welcome{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#12283c 0%,#1c3d5a 55%,#0e4a5c 100%);overflow-y:auto;padding:28px calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .wwrap{min-height:100%;display:flex;gap:56px;max-width:980px;margin:0 auto;align-items:center;justify-content:center;flex-wrap:wrap}
